<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊びの棚 | ゲーム一覧</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/main.js" defer></script>
</head>
<body>
  <header class="site-header container">
    <p class="site-name">遊びの棚</p>
    <p>Scratchでつくったゲームを、ここに。</p>
  </header>
  <main class="container">
    <section aria-labelledby="games-heading">
      <h1 id="games-heading">ゲーム一覧</h1>
      <p>遊びの棚に並ぶゲームを紹介します。</p>
      <div class="game-list">
        <article class="game-card">
          <figure class="game-thumbnail">
            <img src="./assets/images/survivor-title.png" alt="キッズＧＯサバイバーのタイトル画像" width="960" height="720">
            <figcaption class="asset-credit">タイトル画像およびゲーム内の画像に生成AIを使用しています。</figcaption>
          </figure>
          <div class="game-details">
            <p class="game-status">プレイできます</p>
            <h2>キッズＧＯサバイバー</h2>
            <p>なるべく長い時間生き残り、ハイスコアを目指すサバイバー系ゲームです。</p>
            <a class="play-link" href="./play-survivor.html">ゲームで遊ぶ</a>
          </div>
        </article>
      </div>
    </section>
  </main>
  <footer class="container"><p>遊びの棚</p></footer>
</body>
</html>
